services:
  - type: web
    name: harar-ras-hotel-menu
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/menu
    envVars:
      - key: NODE_ENV
        value: production
      - key: HARAR_ADMIN_PASSWORD
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: menu-images
